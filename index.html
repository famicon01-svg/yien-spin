<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}html,body{height:100%}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>以恩一家轉圈圈</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700&display=swap">
<style>
/* Layout: one paper sheet; the family dances in a tilted ring around a crayon sun. Single deliberate light "paper" look. */
:root{--paper:#fffdf6;--line:#e9e4d6;--ink:#3a3550;--sun:#ffcf3f;--sky:#ff7aa8;--soft:#7d7891;color-scheme:light;
--round:"Chiron GoRound TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
html,body{height:100%;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{touch-action:manipulation}
body{background:var(--paper);color:var(--ink);font-family:var(--round);overflow:hidden;
background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px}
.wrap{height:100%;display:flex;flex-direction:column;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
h1{margin:0;text-align:center;font-size:clamp(22px,5vw,38px);font-weight:700;text-wrap:balance;letter-spacing:.04em}
h1 span{color:var(--sky)}
.sub{text-align:center;color:var(--soft);margin:4px 0 0;font-size:14px}
#stage{position:relative;flex:1;min-height:300px}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
button{font:inherit;font-size:16px;font-weight:700;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:999px 820px 900px 760px;padding:8px 18px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.music{background:#ffe3ee}
button:focus-visible{outline:3px dashed var(--sky);outline-offset:3px}
</style>
<div class="wrap">
  <h1>爸爸、媽媽和<span>以恩</span>一起轉圈圈</h1>
  <p class="sub">以恩 4.5 歲畫的・4 個以恩、2 個爸爸、1 個媽媽・點一下小人，他會跳起來轉一圈</p>
  <div id="stage"><canvas id="c"></canvas></div>
  <div class="bar">
    <button id="slow">慢一點</button>
    <button id="pause">暫停</button>
    <button id="fast">快一點</button>
    <button id="dir">換方向</button>
    <button id="music" class="music">播放音樂</button>
  </div>
</div>

const TAG={'以恩':'#ff7aa8','爸爸':'#5b8def','媽媽':'#b07be6'};
// 名字標籤只畫一次存起來，之後每一格直接貼上（避免每格重算字型，iPhone 會越跑越慢）
const LF=40,LABEL={};
function makeLabels(){for(const n in TAG){const c=document.createElement('canvas'),x=c.getContext('2d'),f=`700 ${LF}px "Chiron GoRound TC","PingFang TC","Heiti TC",sans-serif`;
  x.font=f;const tw=Math.ceil(x.measureText(n).width);c.width=tw+LF;c.height=LF*1.5;x.font=f;x.fillStyle=TAG[n];
  const r=c.height/2;x.beginPath();x.moveTo(r,0);x.lineTo(c.width-r,0);x.arc(c.width-r,r,r,-Math.PI/2,Math.PI/2);x.lineTo(r,c.height);x.arc(r,r,r,Math.PI/2,Math.PI*1.5);x.fill();
  x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.fillText(n,c.width/2,c.height*.53);LABEL[n]=c}}
makeLabels();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(makeLabels);
const kids=SRC.map((s,i)=>{const im=new Image();im.src=s;return{im,i,name:NAMES[i],jump:0,spin:0,x:0,y:0,r:0}});
/* ---------- 聲音：全部用 Web Audio 即時合成 ---------- */
let AC=null,master=null,musicOn=false,nextT=0,step=0,timer=null;
function audio(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.6;
  const comp=AC.createDynamicsCompressor();master.connect(comp);comp.connect(AC.destination);}
  if(AC.state==='suspended')AC.resume();return AC}
const hz=m=>440*Math.pow(2,(m-69)/12);
function bell(m,t,dur,vol){// 音樂盒聲
  [[1,1],[2.01,.35],[3.98,.12]].forEach(([mul,v])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=hz(m)*mul;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol*v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur*(mul>1?.5:1));
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05)})}
function pluck(m,t,vol,type){const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();o.type=type||'triangle';o.frequency.value=hz(m);
  f.type='lowpass';f.frequency.value=1400;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.35);
  o.connect(f);f.connect(g);g.connect(master);o.start(t);o.stop(t+.4)}
// 3/4 拍圓舞曲，每小節 6 個八分音符：[音, 長度]
const MEL=[[[76,1],[79,1],[84,2],[79,1],[76,1]],[[81,2],[76,1],[81,1],[84,2]],[[77,1],[81,1],[84,2],[81,1],[77,1]],[[79,2],[83,2],[86,2]],
 [[84,1],[83,1],[84,1],[88,1],[84,2]],[[81,1],[79,1],[81,1],[84,1],[81,2]],[[77,2],[81,1],[77,1],[74,2]],[[79,2],[71,1],[74,1],[79,2]]];
const CH=[[48,64,67],[45,60,64],[41,57,60],[43,59,62],[48,64,67],[45,60,64],[50,62,65],[43,59,62]];
const E8=60/132/2; // 八分音符長度
function scheduleBar(bar,t){const mel=MEL[bar%8],ch=CH[bar%8];let s=0;
  mel.forEach(([m,l])=>{bell(m,t+s*E8,.9,.16);s+=l});
  pluck(ch[0],t,.22);[2,4].forEach(b=>{pluck(ch[1],t+b*E8,.07);pluck(ch[2],t+b*E8,.07)});
  if(bar%4===3){[0,1,2,3,4].forEach(j=>bell([84,88,91,96,100][j],t+5*E8+j*.045,.5,.04))}// 小閃光
  if(bar%2===1)bell(ch[1]+24,t+3*E8,.6,.05)}
function tick(){if(nextT<AC.currentTime)nextT=AC.currentTime+.05;while(nextT<AC.currentTime+.4){scheduleBar(step,nextT);nextT+=6*E8;step++}}
function startMusic(){audio();nextT=AC.currentTime+.08;step=0;timer=setInterval(tick,100);tick();musicOn=true}
function stopMusic(){clearInterval(timer);musicOn=false}
function boing(pitch){if(!AC)return;const t=AC.currentTime;// 跳起來的「啵～咻」
  const o=AC.createOscillator(),g=AC.createGain(),lfo=AC.createOscillator(),lg=AC.createGain();o.type='sine';
  o.frequency.setValueAtTime(220*pitch,t);o.frequency.exponentialRampToValueAtTime(880*pitch,t+.18);o.frequency.exponentialRampToValueAtTime(620*pitch,t+.32);
  lfo.frequency.value=22;lg.gain.value=25*pitch;lfo.connect(lg);lg.connect(o.frequency);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.4);
  o.connect(g);g.connect(master);o.start(t);lfo.start(t);o.stop(t+.45);lfo.stop(t+.45);
  bell(96+Math.round(pitch*3),t+.16,.4,.06);bell(100+Math.round(pitch*3),t+.22,.4,.05)}
function land(){if(!AC)return;pluck(43,AC.currentTime,.18,'sine')}
function jumpKid(k){if(k.jump!==0)return;k.jump=1;boing(k.name==='以恩'?1.25:k.name==='媽媽'?1:.8);setTimeout(()=>land(),680)}
let ang=0,speed=reduce?0.15:0.55,dir=1,paused=false,t=0,last=performance.now();
const conf=Array.from({length:40},()=>({x:Math.random(),y:Math.random(),v:.02+Math.random()*.05,c:['#ff7aa8','#ffcf3f','#7bd389','#6aa9ff','#b38cff'][Math.floor(Math.random()*5)],s:3+Math.random()*5,a:Math.random()*6}));
function sun(cx,cy,R,tt){
  ctx.save();ctx.translate(cx,cy);ctx.rotate(tt*.3);
  ctx.strokeStyle='#ffb21f';ctx.lineWidth=Math.max(3,R*.08);ctx.lineCap='round';
  for(let k=0;k<12;k++){ctx.rotate(Math.PI/6);ctx.beginPath();ctx.moveTo(R*1.25,0);ctx.lineTo(R*1.6+Math.sin(tt*3+k)*R*.1,0);ctx.stroke()}
  ctx.restore();
  ctx.beginPath();ctx.fillStyle='#ffcf3f';ctx.arc(cx,cy,R,0,7);ctx.fill();
  ctx.fillStyle='#3a3550';ctx.beginPath();ctx.arc(cx-R*.3,cy-R*.15,R*.08,0,7);ctx.arc(cx+R*.3,cy-R*.15,R*.08,0,7);ctx.fill();
  ctx.beginPath();ctx.lineWidth=R*.08;ctx.strokeStyle='#3a3550';ctx.arc(cx,cy+R*.05,R*.35,.2,Math.PI-.2);ctx.stroke();
  ctx.fillStyle='rgba(255,122,168,.45)';ctx.beginPath();ctx.arc(cx-R*.55,cy+R*.2,R*.13,0,7);ctx.arc(cx+R*.55,cy+R*.2,R*.13,0,7);ctx.fill();
}
function frame(now){requestAnimationFrame(frame);
  try{render(now)}catch(err){console.error(err);size()}}
function render(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!paused){t+=dt;ang+=dt*speed*dir}
  ctx.clearRect(0,0,W,H);
  for(const p of conf){if(!paused){p.y+=p.v*dt*3;p.a+=dt*2;if(p.y>1.05){p.y=-.05;p.x=Math.random()}}
    ctx.save();ctx.translate(p.x*W+Math.sin(p.a)*8,p.y*H);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.globalAlpha=.6;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()}
  const tall=H>W*1.2;const cx=W/2,cy=H*.5,rx=Math.min(W*(tall?.36:.38),H*.75),ry=Math.min(rx*(tall?.95:.42),H*.3);
  const base=Math.min(W*(tall?.27:.2),H*.32,170);
  // ring shadow
  ctx.beginPath();ctx.ellipse(cx,cy+base*.35,rx,ry,0,0,7);ctx.fillStyle='rgba(58,53,80,.06)';ctx.fill();
  const n=kids.length;
  kids.forEach((k,i)=>{const a=ang+i/n*Math.PI*2;k.a=a;k.depth=Math.sin(a);
    if(!paused&&k.jump>0){k.jump=Math.max(0,k.jump-dt*1.4)}
  });
  const order=[...kids].sort((p,q)=>p.depth-q.depth);
  const back=order.filter(k=>k.depth<0),front=order.filter(k=>k.depth>=0);
  // hand-holding line: crayon rope between neighbors
  function rope(){ctx.save();ctx.strokeStyle='rgba(255,122,168,.55)';ctx.lineWidth=4;ctx.setLineDash([2,8]);ctx.lineCap='round';ctx.beginPath();
    for(let j=0;j<=60;j++){const a=ang+j/60*Math.PI*2;const x=cx+Math.cos(a)*rx,y=cy+Math.sin(a)*ry+Math.sin(a*7+t*4)*3;j?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();ctx.restore()}
  const draw=k=>{
    const sc=.72+.28*(k.depth+1)/2;const sz=base*sc;
    const hop=Math.abs(Math.sin(t*5+k.i*1.3))*sz*.12;
    const jp=k.jump>0?Math.sin((1-k.jump)*Math.PI)*sz*.9:0;
    const x=cx+Math.cos(k.a)*rx,y=cy+Math.sin(k.a)*ry-hop-jp;
    const rot=Math.sin(t*4+k.i)*.18+(k.jump>0?(1-k.jump)*Math.PI*2:0);
    const im=k.im;if(!im.complete||!im.naturalWidth)return;
    const s=sz/Math.max(im.naturalWidth,im.naturalHeight);const w=im.naturalWidth*s,h=im.naturalHeight*s;
    ctx.save();ctx.globalAlpha=.12;ctx.fillStyle='#3a3550';ctx.beginPath();ctx.ellipse(x,cy+Math.sin(k.a)*ry+sz*.45,w*.35*(1-jp/(sz*1.2)),sz*.06,0,0,7);ctx.fill();ctx.restore();
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);
    const flip=Math.cos(k.a*1)*dir; // face the direction they move
    ctx.scale(Math.sign(flip)||1 ,1);
    ctx.globalAlpha=.75+.25*(k.depth+1)/2;
    ctx.drawImage(im,-w/2,-h/2,w,h);ctx.restore();
    k.x=x;k.y=y;k.r=sz/2;
    const fs=Math.max(12,sz*.15),L=LABEL[k.name];if(L){const lw=L.width*fs/LF,lh=L.height*fs/LF;
    ctx.globalAlpha=.7+.3*(k.depth+1)/2;ctx.drawImage(L,x-lw/2,y+h/2+fs*.4,lw,lh);ctx.globalAlpha=1}
  };
  back.forEach(draw);
  sun(cx,cy-base*.05,base*.32,t);
  rope();
  front.forEach(draw);
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(AC)AC.suspend();clearInterval(timer)}
  else{size();last=performance.now();if(AC)AC.resume();if(musicOn){clearInterval(timer);nextT=0;timer=setInterval(tick,100)}}});
addEventListener('pageshow',()=>{size();last=performance.now()});
requestAnimationFrame(frame);
cv.addEventListener('pointerdown',e=>{const b=cv.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;
  const hit=[...kids].sort((p,q)=>q.depth-p.depth).find(k=>Math.hypot(k.x-x,k.y-y)<k.r);
  audio();
  if(hit)jumpKid(hit);else kids.forEach((k,i)=>setTimeout(()=>jumpKid(k),i*110));});
const M=document.getElementById('music');
M.onclick=()=>{if(musicOn){stopMusic();M.textContent='播放音樂'}else{startMusic();M.textContent='關掉音樂'}};
const P=document.getElementById('pause');
P.onclick=()=>{paused=!paused;P.textContent=paused?'繼續':'暫停'};
document.getElementById('slow').onclick=()=>speed=Math.max(.15,speed*.7);
document.getElementById('fast').onclick=()=>speed=Math.min(3,speed*1.4);
document.getElementById('dir').onclick=()=>dir*=-1;
</script>
